# Autopilot: let GitHub merge an autopilot PR once the required checks are green.
# The agent never merges. This workflow only enables (or disables) GitHub native auto-merge, and the
# branch protection of the base branch decides when the merge happens (required status checks).
#
# Requires (see the autopilot setup guide):
# - repository setting "Allow auto-merge" on, branch protection or ruleset on the base branch with the
#   CI checks required;
# - secret AUTOPILOT_MERGE_TOKEN: fine-grained token limited to this repository (contents and pull
#   requests: read and write). A personal token is needed so the merge push triggers the staging deploy:
#   pushes made with the default GITHUB_TOKEN do not start other workflows;
# - optional variables AUTOPILOT_PROTECTED_PATHS (extended regex) and AUTOPILOT_MAX_FILES.
name: autopilot-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: autopilot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the PR may merge on its own
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PROTECTED: ${{ vars.AUTOPILOT_PROTECTED_PATHS || '^(\.github/|\.claude/|CLAUDE\.md$|\.app-factory/|infra/prod|deploy/prod)' }}
          MAX_FILES: ${{ vars.AUTOPILOT_MAX_FILES || '80' }}
        run: |
          set -euo pipefail
          reason=""
          echo "$LABELS" | grep -q '"autopilot"' || reason="no autopilot label"
          echo "$LABELS" | grep -q '"needs-human"' && reason="needs-human label"
          [ "$DRAFT" = "true" ] && reason="draft"
          if [ -z "$reason" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
            count=$(printf '%s\n' "$files" | grep -c . || true)
            hits=$(printf '%s\n' "$files" | grep -E "$PROTECTED" || true)
            if [ -n "$hits" ]; then
              reason="protected paths"
              printf '<!-- autopilot -->\nFusion automatique refusee : la PR touche des chemins proteges.\n\n```\n%s\n```\n\nA relire et fusionner a la main. ✨\n' "$hits" > body.md
            elif [ "$count" -gt "$MAX_FILES" ]; then
              reason="too many files"
              printf '<!-- autopilot -->\nFusion automatique refusee : %s fichiers modifies (plafond %s). A relire et fusionner a la main. ✨\n' "$count" "$MAX_FILES" > body.md
            fi
            if [ -f body.md ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=needs-human" > /dev/null
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md > /dev/null
            fi
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "PR #$PR: ${reason:-eligible}"

      - name: Enable auto-merge
        if: steps.decide.outputs.reason == ''
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_MERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash

      - name: Disable auto-merge
        if: steps.decide.outputs.reason != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_MERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto || true
